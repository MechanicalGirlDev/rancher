frequency_hz = 50.0
request_timeout_ms = 500
real_hardware = false

[controller]
program = "@bin/sutera-demo-diffdrive-controller"
config = { left_rad_s = 1.0, right_rad_s = 0.8 }

[hal]
program = "@bin/sutera-demo-diffdrive-hal"
config = { trace = "diffdrive-stop.txt" }

[[stop]]
id = "wheel/left/velocity"
action = { mode = "free" }

[[stop]]
id = "wheel/right/velocity"
action = { mode = "free" }
