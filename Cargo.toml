[package]
name = "rancher"
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
authors = ["nop <noplab90@gmail.com>"]
repository = "https://github.com/MechanicalGirlDev/rancher"
description = "Bundle entry point: select a main.yaml deployment and delegate lifecycle to Reiny"

[[bin]]
name = "rancher"
path = "src/main.rs"

[dependencies]
velopack = "1.2"
reiny-launch = "0.7.0"
serde_yaml = "0.9"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
unused_results = "warn"
variant_size_differences = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
